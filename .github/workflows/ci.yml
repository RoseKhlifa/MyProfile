name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm verify
      - run: node scripts/check-project-catalog.mjs
      - run: node scripts/check-contributions.mjs --fixture-only
      - run: node scripts/check-contribution-motion.mjs
      - run: node scripts/check-contribution-refresh.mjs
      - run: node scripts/check-visit-counter.mjs
